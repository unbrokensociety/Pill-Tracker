# Builds the release APK on every push / PR. A GitHub Release is published
# only from the main branch, so test branches never reach the in-app updater.
#
# Versioning: versionCode = 2420 + GITHUB_RUN_NUMBER and versionName are set
# in app/build.gradle.kts. versionName must match the "app-version" marker at
# the top of RELEASE_NOTES.md - the in-app updater compares exactly these two.
# The GitHub Release body is RELEASE_NOTES.md as is.
#
# Signing: with the KEYSTORE_BASE64 / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
# secrets the APK is signed with the real release key; otherwise with the
# repo's debug.keystore (see allowDebugSigning in gradle.properties).

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n8933902d075f4b3826b566165d513be473804393\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Ensure Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1 || true
          chmod +x gradlew || true

      - name: Prepare Keystores
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from base64..."
              python3 -c "import base64, re; text=open('debug.keystore.base64').read(); open('debug.keystore','wb').write(base64.b64decode(re.sub(r'\s+', '', text)))" || true
            fi
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release.keystore from secret..."
            python3 -c "import base64, re; text='''${{ secrets.KEYSTORE_BASE64 }}'''; open('release.keystore','wb').write(base64.b64decode(re.sub(r'\s+', '', text)))"
            echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
          else
            echo "::warning::No KEYSTORE_BASE64 secret — the APK will be signed with the debug key (explicit opt-in, -PallowDebugSigning=true). Fine for GitHub Releases + in-app updates, NOT for a store."
          fi

      - name: Check version marker
        # The in-app updater compares versionName with the app-version marker
        # in RELEASE_NOTES.md; if they differ no user is ever offered the update.
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          MARK=$(grep -oP '^> app-version: \K[0-9.]+' RELEASE_NOTES.md | head -1)
          echo "versionName=$NAME  marker=$MARK"
          if [ -z "$NAME" ] || [ "$NAME" != "$MARK" ]; then
            echo "::error::versionName ($NAME) and the app-version marker in RELEASE_NOTES.md ($MARK) must match"
            exit 1
          fi

      - name: Build Release APK
        # The flag is a fallback: allowDebugSigning=true also ships in
        # gradle.properties, so a bare `gradle assembleRelease` builds too.
        run: gradle assembleRelease --no-daemon --stacktrace -PallowDebugSigning=true
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Report Signing Mode
        run: |
          if [ -z "${{ env.KEYSTORE_PATH }}" ]; then
            echo "⚠️  This release artifact is signed with the DEBUG key (no KEYSTORE_BASE64 secret / explicit opt-in). Updates still install over previous debug-signed builds — the in-app update chain stays intact."
          else
            echo "✅ Release artifact signed with the REAL release key."
          fi

      - name: Locate Built APK
        run: |
          mkdir -p build_output
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk pill-tracker.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk pill-tracker.apk
          else
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
            if [ -n "$APK_FILE" ]; then
              cp "$APK_FILE" pill-tracker.apk
            fi
          fi
          ls -la pill-tracker.apk

      - name: Verify APK contains the app code
        run: |
          unzip -l pill-tracker.apk | grep -q 'classes.*\.dex' || { echo "::error::no classes.dex in the APK"; exit 1; }
          unzip -p pill-tracker.apk 'classes*.dex' | grep -qa 'com/aistudio/meditracker/MainActivity' \
            || { echo "::error::MainActivity is missing from the APK - sources were not compiled"; exit 1; }
          echo "APK contains the app code"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pill-tracker-v1.${{ github.run_number }}
          path: pill-tracker.apk

      - name: Ensure Release Notes
        run: |
          if [ ! -s "RELEASE_NOTES.md" ]; then
            echo "### 🚀 What's New in Version 1.${{ github.run_number }}:" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "- 💊 **Smoother Visuals & Animations**: High-performance tactile springs and liquid glass aesthetics." >> RELEASE_NOTES.md
            echo "- ⏱️ **Instant Day Transitions**: Seamless fluid medication schedule & calendar navigation." >> RELEASE_NOTES.md
            echo "- 🔒 **Rock-Solid Build System**: Continuous automated releases & artifact packaging." >> RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Pill Tracker v1.${{ github.run_number }}"
          body_path: RELEASE_NOTES.md
          files: pill-tracker.apk
          overwrite: true
          fail_on_unmatched_files: false
