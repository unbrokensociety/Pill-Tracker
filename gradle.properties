# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment:
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# 2 GB heap: enough for R8 on this app (verified), and small enough
# not to get OOM-killed by the kernel on a ~4 GB machine.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Serial task execution: R8 minification and lintVital both want
# hundreds of MB; running them CONCURRENTLY in one daemon OOM-kills small
# machines (~4 GB). Reliability > a few seconds of build time.
org.gradle.parallel=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
org.gradle.caching=true
# NOTE: configuration cache intentionally disabled — the root build script syncs
# the flat repo-root Kotlin sources into app/src on every configuration phase,
# and the configuration cache would skip that sync and produce stale APKs.
org.gradle.configuration-cache=false
# 2 workers: the box is small (2 cores, ~4 GB RAM) and R8
# minification of the icon-heavy dex needs headroom, not parallelism.
org.gradle.workers.max=2
# Set the Kotlin compiler execution strategy to in-process to avoid "Could not
# connect to Kotlin compile daemon" error.
kotlin.compiler.execution.strategy=in-process

# ── RELEASE SIGNING POLICY (v2.4.8) ─────────────────────────────────────────
# A release APK must NEVER be silently signed with the debug key. Since v2.4.7
# Gradle refuses to package one unless an EXPLICIT opt-in is present:
#
#   • KEYSTORE_PATH + STORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD env vars
#     → the real release key is used (the production path; this flag is ignored).
#   • allowDebugSigning=true HERE (or -PallowDebugSigning=true, or the
#     ALLOW_DEBUG_SIGNING=true env var) → the debug key is used AND the build
#     prints a huge warning banner into the log. This is the deliberate
#     distribution choice of this repo: GitHub Releases + the in-app updater
#     install over builds signed with the stable debug key.
#
# Why this line lives HERE and not in the CI workflow: gradle.properties is a
# plain repo file you upload with every release — so ANY workflow command
# (old or new, with or without extra flags) keeps building, and the decision
# stays visible in the repo instead of hiding in a workflow YAML.
#
# Want a strictly production-signed build? Delete this line (or set false):
# Gradle will then fail any release packaging with instructions instead of
# quietly shipping a debug-signed "release".
allowDebugSigning=true
